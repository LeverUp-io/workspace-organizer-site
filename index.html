<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace Organizer</title>
<meta name="description" content="Workspace Organizer, a Chrome extension that organizes tabs into project workspaces.">
<style>
  :root { --bg: #f6f7f9; --fg: #16181d; --muted: #5d6472; --accent: #2457d6; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101216; --fg: #e8eaee; --muted: #9aa1ad; --accent: #7ea2ff; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: 64px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Workspace Organizer</h1>
  <p>A Chrome extension that gives every project its own workspace: its tabs, links, notes and tasks in one place.</p>
  <p><a href="privacy-policy.html">Privacy policy</a></p>
</main>
</body>
</html>
